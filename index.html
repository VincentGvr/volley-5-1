<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
<meta name="referrer" content="no-referrer" />
<title>Révision des positions — Volley 5-1</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#334155; --line:#475569;
    --accent:#38bdf8; --accent2:#0ea5e9; --ok:#22c55e; --ko:#ef4444;
    --back:#fb7185; --front:#818cf8; --hl:#fbbf24;
    --court1:#0d9488; --court2:#0f766e; --courtline:#ecfeff;
    --text:#e2e8f0; --muted:#94a3b8;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:linear-gradient(160deg,#0f172a,#111827); color:var(--text);
    min-height:100vh; padding:22px 16px calc(104px + env(safe-area-inset-bottom));}
  .wrap{max-width:1000px; margin:0 auto;}
  h1{font-size:1.45rem; margin:0 0 4px; display:flex; align-items:center; gap:10px;}
  .sub{color:var(--text); margin:0 0 18px; font-size:.9rem;}
  .grid{display:grid; grid-template-columns:minmax(280px,330px) 1fr; gap:18px; align-items:start;}
  @media(max-width:780px){ .grid{grid-template-columns:1fr;} }
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px;}
  .card h2{font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px;}

  label.fld{display:block; font-size:.8rem; color:var(--muted); margin:2px 0 6px;}
  select{width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--line);
    padding:10px; border-radius:9px; font-size:.95rem; margin-bottom:14px;}

  .roles{display:flex; flex-direction:column; gap:7px;}
  .role-btn{display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:var(--panel2); border:2px solid transparent; color:var(--text);
    padding:9px 11px; border-radius:10px; cursor:pointer; font-size:.92rem; transition:.15s;}
  .role-btn:hover{border-color:var(--accent2);}
  .role-btn.active{border-color:var(--accent); background:#0b3b53;}
  .badge{width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
    font-weight:700; font-size:.78rem; color:#fff; flex-shrink:0;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);}
  .role-name{display:flex; flex-direction:column; line-height:1.15;}
  .role-name small{color:var(--muted); font-size:.7rem;}

  .modes{display:flex; gap:8px; margin-top:14px;}
  .mode-btn{flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    padding:8px; border-radius:8px; cursor:pointer; font-size:.85rem;}
  .mode-btn.active{background:var(--accent); color:#052a3a; border-color:var(--accent); font-weight:600;}

  .legend{margin-top:14px; font-size:.78rem; color:var(--muted); line-height:1.5;}
  .legend .dot{display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:5px; vertical-align:middle;}

  .court-wrap{display:flex; flex-direction:column; align-items:center;}
  svg{width:100%; max-width:440px; height:auto; touch-action:none;}

  .status{margin-top:12px; min-height:70px; width:100%; max-width:440px;}
  .prompt{font-size:1.02rem; margin:0 0 6px;}
  .prompt b{color:var(--accent);}
  .feedback{font-weight:600; margin:4px 0;}
  .feedback.ok{color:var(--ok);} .feedback.ko{color:var(--ko);}
  .rotbar{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .rot-btn{background:var(--panel2); border:1px solid var(--line); color:var(--text);
    min-width:40px; height:36px; padding:0 8px; border-radius:8px; cursor:pointer; font-weight:600;}
  .rot-btn.active{background:var(--accent); color:#052a3a; border-color:var(--accent);}
  .actions{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}
  .btn{background:var(--accent2); color:#052a3a; border:none; padding:9px 16px;
    border-radius:9px; font-weight:600; cursor:pointer; font-size:.9rem;}
  .btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .score{font-size:.88rem; color:var(--muted);} .score b{color:var(--text);}
  .hint{color:var(--muted); font-size:.8rem; margin-top:8px;}
  .final{text-align:center; padding:8px 0;}
  .final .big{font-size:2rem; font-weight:800; color:var(--accent);}
  text{user-select:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏐 Positions au volley — Système 5-1</h1>
  <p class="sub">Choisis ton poste, puis place-toi correctement en <b>réception</b> sur les 6 rotations. En quiz, les autres joueur·euses sont déjà placé·es : glisse ton rond à la bonne position.</p>

  <div class="grid">
    <div class="card">
      <h2>Ton poste</h2>
      <div class="roles" id="roles"></div>

      <div class="modes">
        <button class="mode-btn active" data-mode="quiz" id="modeQuiz">Quiz</button>
        <button class="mode-btn" data-mode="ref" id="modeRef">Référence</button>
      </div>

      <div class="legend">
        <span class="dot" style="background:var(--back)"></span>Arrière<br>
        <span class="dot" style="background:var(--front)"></span>Avant<br>
      </div>
    </div>

    <div class="card court-wrap">
      <div id="courtHost" style="width:100%; display:flex; justify-content:center;"></div>
      <div class="status" id="status"></div>
    </div>
  </div>
</div>

<script>
"use strict";

/* ================= DONNÉES (relevées sur les schémas P1..P6) =================
   u : 0=gauche → 1=droite   |   v : 0=fond du terrain (ligne de fond) → 1=filet
   v<0 : serveuse derrière la ligne de fond.  back:true = ligne arrière (rouge). */
const F = {
  service: {
    P1:[ {r:'passeur',back:1,server:1,u:0.12,v:-0.05},{r:'libero',back:1,u:0.48,v:0.16},{r:'reception',back:1,u:0.79,v:0.24},
         {r:'reception',back:0,u:0.18,v:0.80},{r:'central',back:0,u:0.50,v:0.80},{r:'pointu',back:0,u:0.82,v:0.80} ],
    P2:[ {r:'central',back:1,server:1,u:0.16,v:-0.08},{r:'reception',back:1,u:0.45,v:0.24},{r:'pointu',back:1,u:0.76,v:0.23},
         {r:'passeur',back:0,u:0.22,v:0.78},{r:'reception',back:0,u:0.48,v:0.78},{r:'central',back:0,u:0.79,v:0.78} ],
    P3:[ {r:'reception',back:1,server:1,u:0.13,v:-0.07},{r:'pointu',back:1,u:0.42,v:0.29},{r:'libero',back:1,u:0.77,v:0.29},
         {r:'central',back:0,u:0.16,v:0.78},{r:'passeur',back:0,u:0.52,v:0.80},{r:'reception',back:0,u:0.83,v:0.78} ],
    P4:[ {r:'pointu',back:1,server:1,u:0.13,v:-0.07},{r:'libero',back:1,u:0.48,v:0.17},{r:'reception',back:1,u:0.78,v:0.27},
         {r:'reception',back:0,u:0.22,v:0.81},{r:'central',back:0,u:0.50,v:0.81},{r:'passeur',back:0,u:0.77,v:0.81} ],
    P5:[ {r:'central',back:1,server:1,u:0.16,v:-0.07},{r:'reception',back:1,u:0.45,v:0.31},{r:'passeur',back:1,u:0.81,v:0.31},
         {r:'pointu',back:0,u:0.17,v:0.83},{r:'reception',back:0,u:0.49,v:0.83},{r:'central',back:0,u:0.81,v:0.83} ],
    P6:[ {r:'reception',back:1,server:1,u:0.11,v:-0.07},{r:'passeur',back:1,u:0.46,v:0.29},{r:'libero',back:1,u:0.76,v:0.28},
         {r:'central',back:0,u:0.23,v:0.81},{r:'pointu',back:0,u:0.54,v:0.81},{r:'reception',back:0,u:0.86,v:0.81} ],
  },
  reception: {
    P1:[ {r:'passeur',back:1,u:0.09,v:0.29},{r:'libero',back:1,u:0.52,v:0.22},{r:'reception',back:1,u:0.80,v:0.34},
         {r:'reception',back:0,u:0.22,v:0.45},{r:'central',back:0,u:0.81,v:0.77},{r:'pointu',back:0,u:0.94,v:0.87} ],
    P2:[ {r:'libero',back:1,u:0.23,v:0.38},{r:'reception',back:1,u:0.48,v:0.26},{r:'pointu',back:1,u:0.59,v:0.10},
         {r:'reception',back:0,u:0.77,v:0.34},{r:'central',back:0,u:0.95,v:0.74},{r:'passeur',back:0,u:0.21,v:0.86} ],
    P3:[ {r:'pointu',back:1,u:0.30,v:0.06},{r:'reception',back:1,u:0.19,v:0.31},{r:'libero',back:1,u:0.50,v:0.23},
         {r:'reception',back:0,u:0.78,v:0.36},{r:'central',back:0,u:0.16,v:0.77},{r:'passeur',back:0,u:0.31,v:0.90} ],
    P4:[ {r:'pointu',back:1,u:0.09,v:0.22},{r:'libero',back:1,u:0.23,v:0.37},{r:'reception',back:1,u:0.49,v:0.22},
         {r:'reception',back:0,u:0.77,v:0.37},{r:'central',back:0,u:0.89,v:0.78},{r:'passeur',back:0,u:0.95,v:0.93} ],
    P5:[ {r:'libero',back:1,u:0.21,v:0.24},{r:'reception',back:1,u:0.50,v:0.20},{r:'passeur',back:1,u:0.86,v:0.79},
         {r:'reception',back:0,u:0.79,v:0.38},{r:'pointu',back:0,u:0.11,v:0.95},{r:'central',back:0,u:0.95,v:0.93} ],
    P6:[ {r:'reception',back:1,u:0.23,v:0.25},{r:'libero',back:1,u:0.54,v:0.20},{r:'passeur',back:1,u:0.39,v:0.70},
         {r:'reception',back:0,u:0.81,v:0.33},{r:'central',back:0,u:0.12,v:0.66},{r:'pointu',back:0,u:0.25,v:0.86} ],
  },
  jeu: {
    JEU:[ {r:'passeur',back:1,u:0.14,v:0.33},{r:'reception',back:1,u:0.48,v:0.15},{r:'libero',back:1,u:0.82,v:0.33},
          {r:'pointu',back:0,u:0.15,v:0.81},{r:'central',back:0,u:0.53,v:0.81},{r:'reception',back:0,u:0.86,v:0.82} ],
  },
};

const ROLES=[
  {key:'passeur',   name:'Passe',            label:'Pa', color:'#f59e0b'},
  {key:'central',   name:'Centre',               label:'C',  color:'#8b5cf6'},
  {key:'reception', name:'R4', label:'R4', color:'#22c55e'},
  {key:'pointu',    name:'Pointe',                label:'Po', color:'#ef4444'},
  {key:'libero',    name:'Libéro/Centre arrière',                  label:'L',  color:'#eab308'},
];
const roleByKey=Object.fromEntries(ROLES.map(r=>[r.key,r]));
const PHASE_NAME={reception:'Réception', jeu:'Dans le jeu', service:'Service'};

/* ================= GÉOMÉTRIE ================= */
const VB_W=340;
const CX0=30, CX1=310, CY0=70, CY1=350;       // notre demi-terrain (9 m x 9 m, carré)
const CW=CX1-CX0, CH=CY1-CY0;
const NET_Y=CY1, OPP_Y=CY1+40;                // filet en bas, camp adverse dessous
const ATTACK_Y=CY0+(6/9)*CH;                  // ligne des 3 m (3 m du filet = 6 m du fond)
const TRAY_Y=OPP_Y+95;                        // réserve (quiz), sous le camp adverse
const VB_H=TRAY_Y+42;                         // hauteur ajustée au contenu
const R=17, THRESH=42;

function toXY(u,v){ return { x:CX0+u*CW, y:CY0+v*CH }; }
function E(n,a){ const e=document.createElementNS('http://www.w3.org/2000/svg',n); for(const k in a)e.setAttribute(k,a[k]); return e; }
function ringColor(p){ return p.back?'var(--back)':'var(--front)'; }

function courtBase(){
  const svg=E('svg',{viewBox:`0 0 ${VB_W} ${VB_H}`});
  const defs=E('defs',{});
  const g=E('linearGradient',{id:'court',x1:0,y1:0,x2:0,y2:1});
  g.appendChild(E('stop',{offset:'0%','stop-color':'#0d9488'}));
  g.appendChild(E('stop',{offset:'100%','stop-color':'#0f766e'}));
  defs.appendChild(g);
  const sh=E('filter',{id:'sh',x:'-40%',y:'-40%',width:'180%',height:'180%'});
  sh.appendChild(E('feDropShadow',{dx:0,dy:1.5,stdDeviation:1.6,'flood-color':'#022c22','flood-opacity':.45}));
  defs.appendChild(sh);
  svg.appendChild(defs);

  svg.appendChild(E('rect',{x:0,y:0,width:VB_W,height:VB_H,fill:'#0b1220'}));
  // camp adverse (estompé)
  svg.appendChild(E('rect',{x:CX0,y:NET_Y,width:CW,height:OPP_Y-NET_Y,fill:'url(#court)',opacity:.28,stroke:'var(--courtline)','stroke-width':1,'stroke-opacity':.35,rx:3}));
  // notre demi-terrain
  svg.appendChild(E('rect',{x:CX0,y:CY0,width:CW,height:CH,fill:'url(#court)',stroke:'var(--courtline)','stroke-width':3,rx:3}));
  // zone d'attaque (avant, entre 3 m et filet) légèrement éclaircie
  svg.appendChild(E('rect',{x:CX0,y:ATTACK_Y,width:CW,height:NET_Y-ATTACK_Y,fill:'#5eead4',opacity:.12}));
  // ligne des 3 m
  svg.appendChild(E('line',{x1:CX0,y1:ATTACK_Y,x2:CX1,y2:ATTACK_Y,stroke:'var(--courtline)','stroke-width':2,opacity:.9}));
  // filet
  svg.appendChild(E('line',{x1:CX0-8,y1:NET_Y,x2:CX1+8,y2:NET_Y,stroke:'#f1f5f9','stroke-width':6,'stroke-dasharray':'4 3'}));
  svg.appendChild(E('circle',{cx:CX0-8,cy:NET_Y,r:3,fill:'#f1f5f9'}));
  svg.appendChild(E('circle',{cx:CX1+8,cy:NET_Y,r:3,fill:'#f1f5f9'}));
  // libellés
  const lab=(x,y,t,anchor='middle')=>{ const e=E('text',{x,y,fill:'#94a3b8','font-size':11,'text-anchor':anchor}); e.textContent=t; svg.appendChild(e); };
  lab(VB_W/2, CY0-46, 'Zone de service (derrière la ligne de fond)');
  lab(VB_W/2, NET_Y+26, 'Filet');
  lab(VB_W/2, OPP_Y+16, 'Camp adverse');
  return svg;
}

function token(svg,p,{highlight=false,ghost=false,label=null}={}){
  const {x,y}=toXY(p.u,p.v);
  const g=E('g',{});
  const c=E('circle',{cx:x,cy:y,r:R,
    fill: ghost?'none' : (highlight?'#fde68a':'#f8fafc'),
    stroke: ringColor(p), 'stroke-width': highlight?4:2.5,
    'stroke-dasharray': ghost?'4 3':'', opacity: ghost?.8:1});
  if(!ghost) c.setAttribute('filter','url(#sh)');
  g.appendChild(c);
  if(!ghost){
    const t=E('text',{x,y:y+4,'text-anchor':'middle','font-size':12,'font-weight':700,fill:ringColor(p)});
    t.textContent = label!==null?label:roleByKey[p.r].label;
    g.appendChild(t);
  }
  svg.appendChild(g);
  return g;
}

/* ================= ÉTAT ================= */
const state={ phase:'reception', role:null, mode:'quiz' };
const quiz={ rots:[], idx:0, score:0, drag:[], svg:null, active:null, done:false };
const ref={ rot:null };

const host=document.getElementById('courtHost');
const statusEl=document.getElementById('status');

/* ---- helpers données ---- */
function rotList(phase){ return phase==='jeu' ? ['JEU'] : ['P1','P2','P3','P4','P5','P6']; }
function rotLabel(rot){ return rot==='JEU' ? 'position de base' : rot; }
function formation(phase,rot){ return F[phase][rot]; }
function targetsFor(phase,rot,role){ return formation(phase,rot).filter(p=>p.r===role); }
function othersFor(phase,rot,role){ return formation(phase,rot).filter(p=>p.r!==role); }

/* ================= MENUS ================= */
function buildRoles(){
  const box=document.getElementById('roles');
  ROLES.forEach(r=>{
    const b=document.createElement('button');
    b.className='role-btn'; b.dataset.role=r.key;
    b.innerHTML=`<span class="badge" style="background:${r.color}">${r.label}</span>
      <span class="role-name">${r.name}<small>${roleSub(r.key)}</small></span>`;
    b.onclick=()=>selectRole(r.key);
    box.appendChild(b);
  });
}
function roleSub(k){return({passeur:'↔︎ pointe',central:'↔︎ libéro/centre arrière',reception:'↔︎ R4',
  pointu:'↔︎ passe',libero:'↔︎ centre'})[k];}

function selectRole(key){
  state.role=key;
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.toggle('active',b.dataset.role===key));
  refresh();
}
function setMode(m){
  state.mode=m;
  document.getElementById('modeQuiz').classList.toggle('active',m==='quiz');
  document.getElementById('modeRef').classList.toggle('active',m==='ref');
  refresh();
}
function refresh(){
  if(!state.role){ renderEmpty(); return; }
  if(state.mode==='quiz') startQuiz(); else { ref.rot=rotList(state.phase)[0]; renderRef(); }
}
function renderEmpty(){
  host.innerHTML=''; host.appendChild(courtBase());
  statusEl.innerHTML=`<p class="prompt">Choisis ton poste pour commencer.</p>`;
}

/* ================= QUIZ (glisser-déposer) ================= */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startQuiz(){
  let rots=rotList(state.phase).filter(rt=>targetsFor(state.phase,rt,state.role).length>0);
  if(state.phase!=='jeu') rots=shuffle(rots);
  quiz.rots=rots; quiz.idx=0; quiz.score=0;
  if(rots.length===0){ // ex : libéro absent (mais improbable sur toute une phase)
    host.innerHTML=''; host.appendChild(courtBase());
    statusEl.innerHTML=`<p class="feedback ko">Ce poste n'est pas présent dans cette phase.</p>`;
    return;
  }
  renderQuestion();
}

function renderQuestion(){
  quiz.done=false; quiz.active=null;
  const rot=quiz.rots[quiz.idx];
  const svg=courtBase(); quiz.svg=svg;
  // autres joueuses déjà placées
  othersFor(state.phase,rot,state.role).forEach(p=>token(svg,p));
  // pions à glisser (réserve)
  const targets=targetsFor(state.phase,rot,state.role);
  quiz.drag = targets.map((t,i)=>{
    const n=targets.length;
    const hx = VB_W/2 + (i-(n-1)/2)*70;
    const obj={ x:hx, y:TRAY_Y, homeX:hx, homeY:TRAY_Y, ok:null, back:t.back };
    obj.g=E('g',{class:'pion',style:'cursor:grab'});
    obj.circle=E('circle',{cx:obj.x,cy:obj.y,r:R,fill:'#fde68a',stroke:'var(--hl)','stroke-width':3});
    obj.text=E('text',{x:obj.x,y:obj.y+4,'text-anchor':'middle','font-size':12,'font-weight':700,fill:'#92400e'});
    obj.text.textContent=roleByKey[state.role].label;
    obj.g.appendChild(obj.circle); obj.g.appendChild(obj.text);
    obj.g.addEventListener('pointerdown',ev=>startDrag(ev,obj));
    svg.appendChild(obj.g);
    return obj;
  });
  // trait réserve
  const tl=E('text',{x:VB_W/2,y:TRAY_Y-24,fill:'#94a3b8','font-size':11,'text-anchor':'middle'});
  tl.textContent='Glisse ton poste sur le terrain';
  svg.appendChild(tl);

  host.innerHTML=''; host.appendChild(svg);
  const role=roleByKey[state.role];
  const plural=targets.length>1?'les '+targets.length+' '+role.label:'la/le '+role.label;
  statusEl.innerHTML=`
    <p class="prompt"><b>${rotLabel(rot)}</b> (${PHASE_NAME[state.phase]})</p>
    <p class="score">Question <b>${quiz.idx+1}/${quiz.rots.length}</b> · Score <b>${quiz.score}</b></p>
    <div class="actions">
      <button class="btn" id="validateBtn">Valider</button>
      <button class="btn ghost" id="resetBtn">Réinitialiser</button>
    </div>`;
  document.getElementById('validateBtn').onclick=validate;
  document.getElementById('resetBtn').onclick=renderQuestion;
}

function svgPoint(svg,ev){
  const pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function startDrag(ev,obj){
  if(quiz.done) return;
  ev.preventDefault(); quiz.active=obj; obj.g.style.cursor='grabbing';
  const p=svgPoint(quiz.svg,ev); obj.off={dx:obj.x-p.x, dy:obj.y-p.y};
  window.addEventListener('pointermove',onDrag);
  window.addEventListener('pointerup',endDrag);
}
function onDrag(ev){
  const o=quiz.active; if(!o) return;
  const p=svgPoint(quiz.svg,ev);
  o.x=Math.max(CX0-20,Math.min(CX1+20, p.x+o.off.dx));
  o.y=Math.max(CY0-60,Math.min(TRAY_Y, p.y+o.off.dy));
  o.circle.setAttribute('cx',o.x); o.circle.setAttribute('cy',o.y);
  o.text.setAttribute('x',o.x); o.text.setAttribute('y',o.y+4);
}
function endDrag(){
  if(quiz.active) quiz.active.g.style.cursor='grab';
  quiz.active=null;
  window.removeEventListener('pointermove',onDrag);
  window.removeEventListener('pointerup',endDrag);
}

function validate(){
  if(quiz.done) return;
  const rot=quiz.rots[quiz.idx];
  const targets=targetsFor(state.phase,rot,state.role).map(t=>({...t,used:false,xy:toXY(t.u,t.v)}));
  let allOk=true;
  quiz.drag.forEach(d=>{
    let best=-1,bd=1e9;
    targets.forEach((t,i)=>{ if(t.used)return; const dist=Math.hypot(d.x-t.xy.x,d.y-t.xy.y); if(dist<bd){bd=dist;best=i;} });
    if(best>=0 && bd<=THRESH){ targets[best].used=true; d.ok=true; }
    else { d.ok=false; allOk=false; }
  });
  if(targets.some(t=>!t.used)) allOk=false;
  quiz.done=true;
  if(allOk) quiz.score++;

  // correction : formation complète correcte + surbrillance du poste
  const svg=courtBase();
  formation(state.phase,rot).forEach(p=> token(svg,p,{highlight:p.r===state.role}) );
  // marque les dépôts erronés
  quiz.drag.forEach(d=>{ if(!d.ok){
    svg.appendChild(E('circle',{cx:d.x,cy:d.y,r:R+4,fill:'none',stroke:'var(--ko)','stroke-width':3,'stroke-dasharray':'4 3'}));
  }});
  host.innerHTML=''; host.appendChild(svg);

  const role=roleByKey[state.role];
  const last=quiz.idx===quiz.rots.length-1;
  statusEl.innerHTML=`
    <p class="feedback ${allOk?'ok':'ko'}">${allOk?'Bien placé !':'Pas tout à fait — voici la correction (poste surligné).'}</p>
    <p class="score">Score <b>${quiz.score}/${quiz.idx+1}</b></p>
    <div class="actions"><button class="btn" id="nextBtn">${last?'Voir le résultat':'Rotation suivante'}</button></div>`;
  document.getElementById('nextBtn').onclick=()=>{ if(last) finalScreen(); else { quiz.idx++; renderQuestion(); } };
}

function finalScreen(){
  host.innerHTML=''; host.appendChild(courtBase());
  const n=quiz.rots.length, pct=Math.round(quiz.score/n*100);
  const msg=pct===100?'Parfait !':pct>=66?'Bien joué':'Continue à réviser';
  statusEl.innerHTML=`<div class="final"><div class="big">${quiz.score}/${n}</div><p>${msg} (${pct}%)</p>
    <div class="actions" style="justify-content:center">
      <button class="btn" id="againBtn">Recommencer</button>
      <button class="btn ghost" id="toRefBtn">Voir la référence</button></div></div>`;
  document.getElementById('againBtn').onclick=startQuiz;
  document.getElementById('toRefBtn').onclick=()=>setMode('ref');
}

/* ================= RÉFÉRENCE ================= */
function renderRef(){
  const rots=rotList(state.phase);
  if(!rots.includes(ref.rot)) ref.rot=rots[0];
  const rot=ref.rot;
  const svg=courtBase();
  formation(state.phase,rot).forEach(p=> token(svg,p,{highlight:p.r===state.role}) );
  host.innerHTML=''; host.appendChild(svg);
  const role=roleByKey[state.role];
  let bar='';
  if(state.phase!=='jeu'){
    bar='<div class="rotbar">'+rots.map(r=>`<button class="rot-btn ${r===rot?'active':''}" data-r="${r}">${r}</button>`).join('')+'</div>';
  }
  const inForm = formation(state.phase,rot).some(p=>p.r===state.role);
  statusEl.innerHTML=`
    ${bar}
    ${inForm?'':'<p class="feedback ko">Ce poste n\'est pas sur le terrain dans cette rotation.</p>'}
    <p class="hint">Rouge = ligne arrière · Bleu = ligne avant.</p>`;
  statusEl.querySelectorAll('.rot-btn').forEach(b=>b.onclick=()=>{ ref.rot=b.dataset.r; renderRef(); });
}

/* ================= INIT ================= */
document.getElementById('modeQuiz').onclick=()=>setMode('quiz');
document.getElementById('modeRef').onclick=()=>setMode('ref');
buildRoles();
renderEmpty();
</script>
